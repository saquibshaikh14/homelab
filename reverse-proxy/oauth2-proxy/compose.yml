services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OAUTH2_PROXY_PROVIDER=github
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_COOKIE_DOMAINS=.homelab.msaquib.com
      - OAUTH2_PROXY_WHITELIST_DOMAINS=.homelab.msaquib.com
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST=false
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_GITHUB_USERS=saquibshaikh14
      - OAUTH2_PROXY_PASS_ACCESS_TOKEN=true
      - OAUTH2_PROXY_SET_AUTHORIZATION_HEADER=true
      - OAUTH2_PROXY_REDIRECT_URL=https://auth.homelab.msaquib.com/oauth2/callback
      - OAUTH2_PROXY_SIGN_OUT_REDIRECT_URL=https://homelab.msaquib.com/
    networks:
      - management_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.oauth2-proxy.rule=Host(`auth.homelab.msaquib.com`) || PathPrefix(`/oauth2`)
      - traefik.http.routers.oauth2-proxy.priority=100
      - traefik.http.routers.oauth2-proxy.entrypoints=websecure
      - traefik.http.routers.oauth2-proxy.tls=true
      - traefik.http.routers.oauth2-proxy.tls.certresolver=cloudflare
      - traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180

networks:
  management_net:
    external: true
