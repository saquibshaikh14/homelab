<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homelab</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="container">

    <nav class="top-nav">
      <div class="profile-pill">
        <span class="status-indicator"></span>
        <span class="profile-username">saquibshaikh14</span>
        <span class="pill-divider"></span>
        <a href="/oauth2/sign_out" class="profile-signout" title="Sign out of homelab">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Sign Out</span>
        </a>
      </div>
    </nav>

    <header>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>

      <div class="stats">
        <div class="stat">
          <span class="value" id="service-count"></span>
          <span class="label">Services</span>
        </div>

        <div class="stat">
          <span class="value" id="server-count"></span>
          <span class="label">Server</span>
        </div>

        <div class="stat">
          <span class="value" id="private-percent"></span>
          <span class="label">Private</span>
        </div>
      </div>
    </header>

    <main id="content"></main>

    <footer>
      Powered by Tailscale • CoreDNS • Traefik • Docker
    </footer>

  </div>

  <script>
    async function loadServices() {

      const response = await fetch("./services.json");
      const data = await response.json();

      document.getElementById("title").textContent =
        data.homelab.name;

      document.getElementById("subtitle").textContent =
        data.homelab.subtitle;

      const totalServices =
        data.sections.reduce(
          (sum, section) =>
            sum +
            section.services.filter(
              service => service.status === "active"
            ).length,
          0
        );

      document.getElementById("service-count").textContent =
        totalServices;

      document.getElementById("server-count").textContent =
        data.stats.server;

      document.getElementById("private-percent").textContent =
        data.stats.private;

      const content =
        document.getElementById("content");

      data.sections.forEach(section => {

        const sectionElement =
          document.createElement("section");

        sectionElement.className = "section";

        sectionElement.innerHTML = `
          <h2>${section.title}</h2>
          <div class="cards"></div>
        `;

        const cards =
          sectionElement.querySelector(".cards");

        section.services.forEach(service => {

          const card =
            document.createElement(
              service.status === "active"
                ? "a"
                : "div"
            );

          card.classList.add("card");

          if (service.status !== "active") {
            card.classList.add("disabled");
          }

          if (service.url) {
            card.href = service.url;
            card.target = "_blank";
            card.rel = "noopener noreferrer";
          }

          card.innerHTML = `
            <div class="icon">
              <img
                src="${service.icon}"
                alt="${service.name}">
            </div>

            <h3>${service.name}</h3>

            <p>${service.description}</p>
          `;

          cards.appendChild(card);
        });

        content.appendChild(sectionElement);
      });
    }

    loadServices();
  </script>

</body>

</html>
