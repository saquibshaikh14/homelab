services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser

    restart: unless-stopped

    user: "1000:1000"

    volumes:
      - /home/saquib/homelab:/srv
      - ./data:/database
      - ./config:/config

    networks:
      - management_net

    labels:
      - traefik.enable=true

      - traefik.http.routers.filebrowser.rule=Host(`files.homelab.msaquib.com`)
      - traefik.http.routers.filebrowser.entrypoints=websecure
      - traefik.http.routers.filebrowser.tls=true
      - traefik.http.routers.filebrowser.tls.certresolver=cloudflare
      - traefik.http.routers.filebrowser.middlewares=github-auth@file

      - traefik.http.services.filebrowser.loadbalancer.server.port=80

networks:
  management_net:
    external: true
